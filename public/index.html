<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SENTOX</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f4f6f9;
}

/* LOGO PLEIN LARGEUR */
.hero {
    width: 100%;
    height: 250px;
}

.hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* CONTENU */
.container {
    text-align: center;
    padding: 20px;
}

/* INPUT */
#search {
    width: 50%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

/* BOUTONS */
button {
    padding: 10px 15px;
    margin: 8px;
    border: none;
    border-radius: 6px;
    background: #2e8b57;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #256d47;
}

/* RESULTAT */
#resultat {
    margin-top: 20px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: left;
}
</style>

</head>

<body>

<!-- ✅ LOGO SEUL (PAS DE TEXTE SENTOX EN DOUBLE) -->
<div class="hero">
    <img src="logo.jpg">
</div>

<div class="container">

    <!-- ✅ UNE SEULE BARRE -->
    <input id="search" placeholder="Entrer une substance">

    <br>

    <!-- ✅ BOUTONS -->
    <button onclick="rechercher()">Recherche</button>
    <button onclick="interaction()">Interaction</button>
    <button onclick="pdf()">PDF</button>
    <button onclick="analyseIA()">Analyse IA</button>

    <!-- RESULTAT -->
    <div id="resultat"></div>

<div id="result" style="
margin-top:20px;
padding:20px;
background:white;
border-radius:10px;
width:70%;
margin-left:auto;
margin-right:auto;
min-height:100px;
white-space:pre-wrap;
font-family:Arial;
"></div>

<!-- 🔗 LIEN SCRIPT -->
<script src="script.js"></script>

</body>
</html>
